name: Analyze Toolchain Upgrade

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock

concurrency:
  group: analyze-toolchain-upgrade
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.detect.outputs.branch }}
      changed: ${{ steps.decision.outputs.changed || 'false' }}
      skipped_for_pr: ${{ steps.existing.outputs.found || 'false' }}
      title: ${{ steps.detect.outputs.title }}
      typescript_current: ${{ steps.detect.outputs.typescript_current }}
      typescript_target: ${{ steps.detect.outputs.typescript_target }}
      vite_plus_current: ${{ steps.detect.outputs.vite_plus_current }}
      vite_plus_target: ${{ steps.detect.outputs.vite_plus_target }}
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Detect toolchain upgrade
        id: detect
        env:
          AFTER_REF: ${{ github.sha }}
          BEFORE_REF: ${{ github.event.before }}
        run: bun scripts/detect-toolchain-upgrade.ts

      - name: Check for an open analysis PR
        if: steps.detect.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          number=$(gh pr list --state open --head "$UPGRADE_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Open analysis PR #$number already exists on $UPGRADE_BRANCH; preserving its review state."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to create an analysis PR
        id: decision
        env:
          ANALYSIS_REQUIRED: ${{ steps.detect.outputs.changed }}
          UPGRADE_PR_EXISTS: ${{ steps.existing.outputs.found }}
        run: |
          if [[ "$ANALYSIS_REQUIRED" == "true" && "$UPGRADE_PR_EXISTS" != "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream release data
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESCRIPT_CURRENT: ${{ needs.detect.outputs.typescript_current }}
          TYPESCRIPT_TARGET: ${{ needs.detect.outputs.typescript_target }}
          VITE_PLUS_CURRENT: ${{ needs.detect.outputs.vite_plus_current }}
          VITE_PLUS_TARGET: ${{ needs.detect.outputs.vite_plus_target }}
        run: |
          mkdir -p .codex/upgrade-data
          if [[ "$VITE_PLUS_CURRENT" != "$VITE_PLUS_TARGET" ]]; then
            curl --fail --silent --show-error \
              --output .codex/upgrade-data/vite-plus-current.json \
              "https://registry.npmjs.org/vite-plus/$VITE_PLUS_CURRENT"
            curl --fail --silent --show-error \
              --output .codex/upgrade-data/vite-plus-target.json \
              "https://registry.npmjs.org/vite-plus/$VITE_PLUS_TARGET"
            gh api "repos/voidzero-dev/vite-plus/releases?per_page=100" \
              > .codex/upgrade-data/vite-plus-releases.json
            gh api "repos/oxc-project/oxc/releases?per_page=100" \
              > .codex/upgrade-data/oxc-releases.json
          fi
          if [[ "$TYPESCRIPT_CURRENT" != "$TYPESCRIPT_TARGET" ]]; then
            gh api "repos/microsoft/TypeScript/releases?per_page=100" \
              > .codex/upgrade-data/typescript-releases.json
          fi

      - name: Analyze upgrade with Codex
        id: codex
        env:
          BEFORE_REF: ${{ github.event.before }}
          TYPESCRIPT_CURRENT: ${{ needs.detect.outputs.typescript_current }}
          TYPESCRIPT_TARGET: ${{ needs.detect.outputs.typescript_target }}
          VITE_PLUS_CURRENT: ${{ needs.detect.outputs.vite_plus_current }}
          VITE_PLUS_TARGET: ${{ needs.detect.outputs.vite_plus_target }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/analyze-toolchain-upgrade.md
          codex-args: '["--ephemeral"]'
          output-schema-file: .github/codex/upgrade-output.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

  create-pr:
    needs: [detect, analyze]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Apply Codex semver analysis
        id: analysis
        env:
          CODEX_RESULT: ${{ needs.analyze.outputs.result }}
        run: bun scripts/apply-upgrade-analysis.ts

      - name: Test
        run: vp test

      - name: Verify package
        run: vp check && vp pack

      - name: Commit release branch
        env:
          UPGRADE_BRANCH: ${{ needs.detect.outputs.branch }}
          UPGRADE_TITLE: ${{ needs.detect.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPGRADE_BRANCH"
          git add package.json
          git commit -m "$UPGRADE_TITLE"
          git fetch origin "$UPGRADE_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$UPGRADE_BRANCH"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_BRANCH: ${{ needs.detect.outputs.branch }}
          UPGRADE_TITLE: ${{ needs.detect.outputs.title }}
        run: |
          gh pr create \
            --base main \
            --head "$UPGRADE_BRANCH" \
            --title "$UPGRADE_TITLE" \
            --body-file .codex/upgrade-pr-body.md \
            --draft

  report-no-change:
    needs: detect
    if: needs.detect.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          SKIPPED_FOR_PR: ${{ needs.detect.outputs.skipped_for_pr }}
          TYPESCRIPT_CURRENT: ${{ needs.detect.outputs.typescript_current }}
          TYPESCRIPT_TARGET: ${{ needs.detect.outputs.typescript_target }}
          VITE_PLUS_CURRENT: ${{ needs.detect.outputs.vite_plus_current }}
          VITE_PLUS_TARGET: ${{ needs.detect.outputs.vite_plus_target }}
        run: |
          if [[ "$SKIPPED_FOR_PR" == "true" ]]; then
            echo "An analysis PR for this toolchain version is already open."
          else
            echo "No analysis PR is required."
            echo "vite-plus: $VITE_PLUS_CURRENT -> $VITE_PLUS_TARGET"
            echo "TypeScript: $TYPESCRIPT_CURRENT -> $TYPESCRIPT_TARGET"
          fi
