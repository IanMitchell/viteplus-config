name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false

      - name: Read package metadata
        id: package
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `name=${packageJson.name}\nversion=${packageJson.version}\n`);
          '

      - name: Check npm for this version
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: vp install --frozen-lockfile

      - name: Verify package
        if: steps.registry.outputs.published == 'false'
        run: vp check && vp pack

      - name: Inspect package contents
        if: steps.registry.outputs.published == 'false'
        run: npm pack --dry-run --json --ignore-scripts

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public --ignore-scripts

      - name: Report an existing version
        if: steps.registry.outputs.published == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; nothing to do."
