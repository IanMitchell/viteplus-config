name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Test
        run: vp test

      - name: Verify package
        run: vp check && vp pack

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish-npm
      cancel-in-progress: false
      queue: max
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      published_now: ${{ steps.publish.outputs.published || 'false' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false

      - name: Read package metadata
        id: package
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `name=${packageJson.name}\nversion=${packageJson.version}\n`);
          '

      - name: Check npm for this version
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: vp install --frozen-lockfile

      - name: Build package
        if: steps.registry.outputs.published == 'false'
        run: vp pack

      - name: Inspect package contents
        if: steps.registry.outputs.published == 'false'
        run: npm pack --dry-run --json --ignore-scripts

      - name: Publish to npm
        id: publish
        if: steps.registry.outputs.published == 'false'
        run: |
          npm publish --access public --ignore-scripts
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Report an existing version
        if: steps.registry.outputs.published == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; nothing to do."

  release:
    if: needs.publish.outputs.package_version != ''
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.publish.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
          PUBLISHED_NOW: ${{ needs.publish.outputs.published_now }}
        run: |
          release_tag="v$PACKAGE_VERSION"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists; nothing to do."
            exit 0
          fi

          if [[ "$PUBLISHED_NOW" == "true" ]]; then
            release_sha="$GITHUB_SHA"
          else
            release_sha=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead)
            if [[ -z "$release_sha" ]]; then
              echo "Could not determine the source commit for $PACKAGE_NAME@$PACKAGE_VERSION." >&2
              exit 1
            fi
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.type')
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
            fi
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "Release tag $release_tag already points to $tag_sha instead of $release_sha." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$release_tag" \
              --field sha="$release_sha" \
              >/dev/null
          fi

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$release_tag"
